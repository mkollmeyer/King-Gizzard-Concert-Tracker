services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped
  
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kglw-frontend
    image: maxkollmeyer/kglw-frontend:v1.1
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    env_file:
      - ./Server/.env
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: kglw-backend
    image: maxkollmeyer/kglw-backend:v1.0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      NODE_ENV: "${NODE_ENV:-production}"
      MONGO_URI: "${MONGO_URI:?Set MONGO_URI in the project .env file}"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  mongodb:
    image: mongo:7.0
    container_name: app-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in the project .env file}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in the project .env file}"
      MONGO_INITDB_DATABASE: "${MONGO_DB_NAME:?Set MONGO_DB_NAME in the project .env file}"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge